name: CI

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v1
        with:
          tree-sitter-ref: v0.21.0
      - name: Run tests
        uses: tree-sitter/parser-test-action@v2
        with:
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
          test-swift: true
      - name: Set up examples
        run: |-
          git clone https://github.com/pinterest/ktlint            examples/ktlint --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/intellij-rust/intellij-rust examples/intellij-rust --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/libre-tube/LibreTube        examples/LibreTube --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/mockk/mockk                 examples/mockk --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/oss-review-toolkit/ort      examples/ort --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/getsentry/sentry-java       examples/sentry-java --single-branch --depth=1 --filter=blob:none
      - name: Parse examples
        uses: tree-sitter/parse-action@v4
        with:
          files: |
            examples/**/*.kt
            !examples/LibreTube/app/src/main/java/com/github/libretube/util/DefaultTrackSelectorWithAudioQualitySupport.kt
            !examples/ktlint/ktlint-cli/src/main/kotlin/com/pinterest/ktlint/cli/internal/KtlintCommandLine.kt
            !examples/mockk/modules/mockk-dsl/src/commonMain/kotlin/io/mockk/API.kt
            !examples/ort/model/src/main/kotlin/config/AnalyzerConfiguration.kt
            !examples/ort/model/src/main/kotlin/config/PackageManagerConfiguration.kt
            !examples/ort/model/src/main/kotlin/ResolvedConfiguration.kt
            !examples/ort/plugins/api/src/main/kotlin/OrtPluginOption.kt
            !examples/ort/plugins/scanners/scanoss/src/test/resources/exclusionTest/random-data-05-04-43.kt
            !examples/ort/plugins/scanners/scanoss/src/test/resources/exclusionTest/random-data-05-05-29.kt
            !examples/ort/plugins/scanners/scanoss/src/test/resources/filesToScan/random-data-05-06-11.kt
            !examples/ort/plugins/scanners/scanoss/src/test/resources/filesToScan/random-data-05-07-04.kt
